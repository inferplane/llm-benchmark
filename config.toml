# ── vLLM on the shared mall-apne2-mgmt EKS cluster (ap-northeast-2), gpu-bench
# NodePool (see deploy/karpenter-gpu.yaml), port-forwarded to localhost:8000.
# Pricing verified via `aws pricing get-products` for ap-northeast-2 on
# 2026-07-15. gpu_instance_type/tensor_parallel_size document what
# deploy/serve.sh's second argument SHOULD be for this model — and must match
# an instance type actually listed in deploy/karpenter-gpu.yaml's NodePool, or
# the pod stays Pending forever (nodeSelector requires an exact match).
# g6 (NVIDIA L4) sizing: 4xlarge (1 GPU/22GB) for the 8B model, 12xlarge
# (4 GPU/89GB, TP=4) for 27-32B, 48xlarge (8 GPU/179GB, TP=8) for 70B.
# Tried g7e ("RTX PRO Server 6000", 96GB/GPU — a newer family found by
# checking live AWS data) as a cheaper single-GPU alternative for 27B+; real
# capacity/pricing checked out, but reverted — this cluster's Karpenter is
# v1.9.0 and doesn't yet have g7e in its instance-type data, so it can never
# schedule a pod requesting nvidia.com/gpu onto one. See the note in
# deploy/karpenter-gpu.yaml.

[[models]]
name = "llama-3.1-8b"
api = "openai"
base_url = "http://localhost:8000/v1"
model_id = "meta-llama/Llama-3.1-8B-Instruct"
gpu_hourly_usd = 1.6270            # g6.4xlarge, 1x L4 (22.4GB) — fits 8B fp16 on one GPU
gpu_instance_type = "g6.4xlarge"
tensor_parallel_size = 1
concurrency = 32
enabled = true            # validated live: Meta gate approved 2026-07-17, deploys clean, real ko->en translation

[[models]]
name = "llama-3.3-70b"
api = "openai"
base_url = "http://localhost:8000/v1"
model_id = "meta-llama/Llama-3.3-70B-Instruct"
# --enforce-eager: same failure mode as exaone-3.5-32b — 70B fp16 leaves only
# ~3.4GiB/GPU free after weights+KV cache on g6.48xlarge, real CUDA OOM during
# CUDA graph capture (torch.cuda.graph capture_end), not KV cache sizing
# itself, confirmed live. Same caveat applies: this model's measured
# throughput isn't graph-accelerated (see bench/report.py's run_config_of).
extra_vllm_args = ["--enforce-eager"]
gpu_hourly_usd = 16.4160           # g6.48xlarge, 8x L4 (179GB total) — 70B fp16 (~140GB) needs tensor-parallel=8
gpu_instance_type = "g6.48xlarge"
tensor_parallel_size = 8
concurrency = 32
enabled = true            # validated live: Meta gate approved 2026-07-17, deploys clean with --enforce-eager, real ko->en translation

[[models]]
name = "gemma-4-31b"
api = "openai"
base_url = "http://localhost:8000/v1"
# Gemma 4 (released 2026-04-02, Apache 2.0, ungated — verified live) supersedes
# Gemma 3. Dense 31B chosen over the 26B-A4B MoE variant to match the other
# vLLM entries (Qwen3.6-27B, EXAONE-32B are dense too) — no MoE-vs-dense confound.
model_id = "google/gemma-4-31B-it"
# g6.12xlarge (4x L4, 89.4GB total) AND g6.48xlarge (8x L4, 179GB total) both
# OOM'd live, reproducibly — same root cause both times: g6-family GPUs are
# all 22.4GB/GPU regardless of instance size, and tensor-parallelism only
# shards the shardable weights. Gemma 4's vision/multimodal encoder is
# replicated per-GPU rather than sharded, so more g6 GPUs of the same size
# never bought it headroom. Fixed by moving to g6e (L40S, ~48GB/GPU) instead
# of scaling g6 further. g6e.12xlarge only schedules in ap-northeast-2a/2b on
# this account; 2b's subnet blocks HF downloads (see karpenter-gpu.yaml), so
# the NodePool's zone list is now restricted to 2a only.
gpu_hourly_usd = 12.9001           # g6e.12xlarge, 4x L40S (~192GB total) — verified live via aws pricing
gpu_instance_type = "g6e.12xlarge"
tensor_parallel_size = 4
extra_vllm_args = ["--quantization=fp8"]
# BLOCKED — disabled after 3 real live attempts, not a config guess:
#  1. g6.12xlarge (4x L4, 22.4GB/GPU) fp16: CUDA OOM at KV-cache init.
#  2. g6.48xlarge (8x L4, same 22.4GB/GPU) fp16: CUDA OOM again — more GPUs of
#     the same per-GPU size didn't help (see below).
#  3. g6e.12xlarge (4x L40S, ~44.4GB/GPU usable) + --quantization=fp8: FP8
#     DID shrink the language-model weights (~9.69GiB/GPU, verified in vLLM's
#     own "Model loading took" log line, down from ~15GB+ unquantized-per-shard)
#     but total in-use memory during KV-cache init still hit ~41.3/44.4GiB —
#     the gap is Gemma 4's multimodal/vision encoder, which vLLM's
#     --quantization flag does not quantize and which is NOT tensor-parallel-
#     sharded (replicated in full on every GPU regardless of TP degree). That
#     encoder alone is consuming ~30GB+ per GPU. No instance type in this
#     cluster's supported families (g6/g6e) has enough per-GPU VRAM left over
#     for that plus KV cache. Fixing this for real needs an 80GB-class GPU
#     (A100/H100 — p4d/p4de/p5 family), which is a different cost tier this
#     cluster's Karpenter NodePool doesn't provision and would undercut the
#     point of benchmarking "efficient open-weight models" in the first
#     place. Revisit only if a text-only (non-multimodal) Gemma 4 checkpoint
#     ships, or if this cluster later gets an 80GB-GPU NodePool for other
#     reasons.
concurrency = 32
enabled = false

[[models]]
name = "qwen3.6-27b"
api = "openai"
base_url = "http://localhost:8000/v1"
# Qwen3.6 (released 2026-04-22, Apache 2.0, ungated — verified live) supersedes
# Qwen3. Dense 27B chosen over the 35B-A3B MoE variant for the same reason as
# gemma-4-31b above — matches the other dense entries in this roster.
model_id = "Qwen/Qwen3.6-27B"
# Qwen3.6's chat template defaults to emitting a <think>...</think> reasoning
# block unless enable_thinking=False is passed — verified against the live
# tokenizer_config.json chat_template. Without this, output_text would be
# polluted with reasoning traces instead of a clean translation.
chat_template_kwargs = { enable_thinking = false }
gpu_hourly_usd = 5.6582            # g6.12xlarge — 27B fp16 needs tensor-parallel=4
gpu_instance_type = "g6.12xlarge"
tensor_parallel_size = 4
concurrency = 32
enabled = true            # validated live: deploys clean, real ko->en translation, no <think> leak

[[models]]
name = "exaone-3.5-32b"
api = "openai"
base_url = "http://localhost:8000/v1"
model_id = "LGAI-EXAONE/EXAONE-3.5-32B-Instruct"
# EXAONE's HF repo ships custom modeling code (not a stock transformers arch)
# — vLLM refuses to load it without this, live-verified 400/validation error
# ("contains custom code which must be executed... pass trust_remote_code=True").
# --enforce-eager: 32B fp16 leaves only ~4.9GiB/GPU free after weights+KV
# cache on g6.12xlarge (4x L4, 22.4GB/GPU) — real CUDA OOM during CUDA graph
# capture (torch.cuda.graph capture_end), not KV cache sizing itself,
# confirmed live (23 crash-loop restarts before this was added). Skipping
# graph capture is the standard fix for a fit this tight; it does mean this
# model's measured throughput isn't graph-accelerated like the other vLLM
# entries — a real caveat for cross-model throughput comparison, not just a
# footnote (see bench/report.py's run_config_of, which echoes
# extra_vllm_args verbatim into the manifest for exactly this reason).
extra_vllm_args = ["--trust-remote-code", "--enforce-eager"]
gpu_instance_type = "g6.12xlarge"
tensor_parallel_size = 4
gpu_hourly_usd = 5.6582            # g6.12xlarge — 32B fp16 needs tensor-parallel=4
concurrency = 32
enabled = true            # validated live: deploys clean (eager mode), real ko->en translation with correct numbers
