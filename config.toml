# LLM 금융 번역 벤치마크 설정
# 실행: `uv run bench/run.py --pairs ko-en,en-ko --limit 5 --models nova-lite`

[aws]
region = "us-west-2"

[scenario.finqa]
concurrency_default = 2
sample_size = 20
seed = 13
split = "dev"
source_revision = "0f16e2867befa6840783e58be38c9efb9229d742"

[scenario.finqa_audited]
concurrency_default = 2
sample_size = 20
seed = 20260919
split = "dev"
source_revision = "0f16e2867befa6840783e58be38c9efb9229d742"
vllm_image = "vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1"
max_model_len = 8192

[scenario.translation]
src_lang = "ko"
targets = ["en", "ja", "zh", "es", "fr", "de", "pt", "ru", "it", "vi", "id", "th", "ar", "hi", "tr"]
directions = "both"          # ko->X and X->ko => 30 pairs
concurrency_default = 8
flores_per_pair = 100
# Scaled 5->10 alongside flores_per_pair. Unlike FLORES (fixed-seed shuffle +
# slice — growing per_pair only appends new ids), bench/dataset.py's
# synthetic generator fully overwrites synthetic.jsonl on every regen and is
# LLM-generated (not sampled from a fixed corpus), so the *content* under
# stable ids like synthetic-ko0 changes even at temperature=0 on every
# regen. This DID happen live: 13 models' synthetic-track results (cached
# under a run predating this scale-up) were invalidated and had to be
# deleted from that run's translations.jsonl/judgments.jsonl and redone
# against the new 170-row file — not a hypothetical, a real cache
# inconsistency hit and fixed. Any future bump here needs the same
# invalidate-and-redo step for every existing run, not just a config edit.
synthetic_per_pair = 10
# Two independent judges, scored separately then averaged per-axis in
# bench/judge.py — a single judge (sol alone, pre-2026-07-21) can't be told
# apart from its own house style/provider bias. sol is bedrock-mantle
# (Responses API, SigV4 — bench.run.call_mantle); fable-5 is plain Bedrock
# Converse (bench.run.call_bedrock) via its inference profile, NOT mantle —
# confirmed live via `aws bedrock get-foundation-model`
# (inferenceTypesSupported: ["INFERENCE_PROFILE"]), same pattern as the other
# Claude entries in [[models]]. Pricing kept here, not in [[models]], since
# both are deliberately excluded from the candidate list (avoids a judge
# scoring its own tier). sol price verified against
# developers.openai.com/api/docs/pricing on 2026-07-17. fable-5 price
# confirmed live against aws.amazon.com/bedrock/pricing (standard commercial
# region, us-west-2/us-east-*, NOT the GovCloud table) on 2026-07-21 —
# $10/$50 per 1M in/out, exactly 2x Claude Opus 4.8's own standard-region
# price of $5/$25 (also confirmed live same day) at this Mythos-tier model.
[[scenario.translation.judges]]
name = "sol"
api = "bedrock_mantle"
model_id = "openai.gpt-5.6-sol"
mantle_region = "us-east-1"
price_in = 5.00
price_out = 30.00

# fable-5 has a "strong safeguards" content-safety classifier (per AWS's
# GA announcement) that deterministically content_filters ~4.5% of FLORES
# general-domain sentences with no apparent sensitive content (verified
# live: identical prompt hit the same content_filtered verdict on 3/3
# repeat calls — e.g. tuberculosis statistics, Casablanca's naming history;
# zero such blocks on the synthetic financial-document track). Retrying
# never recovers these, so bench/judge.py substitutes the fallback judge
# below (a full second opinion, not a silent single-judge downgrade) only
# for the specific segments fable-5 itself refuses — see judge_one's
# call_judge_with_fallback. fallback_name becomes that segment's per-judge
# key in judgments.jsonl (e.g. "fable-5-fallback_overall"), and
# bench/report.py's build_report expands this into its own compute_judge_cost
# entry so its tokens are billed at opus-4.8's rate, not fable-5's.
[[scenario.translation.judges]]
name = "fable-5"
api = "bedrock"
model_id = "us.anthropic.claude-fable-5"
price_in = 10.00
price_out = 50.00
fallback_name = "fable-5-fallback"
fallback_model_id = "us.anthropic.claude-opus-4-8"
fallback_price_in = 5.00
fallback_price_out = 25.00

# FLORES-200(flores_plus) language codes, indexed by the ISO code above
[scenario.translation.flores_codes]
ko = "kor_Hang"
en = "eng_Latn"
ja = "jpn_Jpan"
zh = "cmn_Hans"   # FLORES indexes Mandarin under ISO 639-3 "cmn", not the "zho" macrolanguage code — verified against live data
es = "spa_Latn"
fr = "fra_Latn"
de = "deu_Latn"
pt = "por_Latn"
ru = "rus_Cyrl"
it = "ita_Latn"
vi = "vie_Latn"
id = "ind_Latn"
th = "tha_Thai"
ar = "arb_Arab"
hi = "hin_Deva"
tr = "tur_Latn"

