# ── Amazon Translate — a managed, non-LLM MT baseline (bench.run.call_translate).
# Confirmed live: supports all 15 target languages here (`aws translate
# list-languages`) and 10,000-byte synchronous input cap comfortably covers
# this dataset's longest source segment (~5KB, a synthetic financial doc).
# Priced per INPUT character, not per token — $0.000015/char verified live via
# `aws pricing get-products --service-code translate` for us-west-2's
# TranslateText usage type. model_id is nominal (there's no selectable model),
# kept only so manifest.json/report.py's schema doesn't need a special case.
[[models]]
name = "amazon-translate"
api = "translate"
model_id = "aws.translate.text"
translate_region = "us-west-2"
price_per_char = 0.000015

# ── OpenAI models, accessed via Bedrock's bedrock-mantle endpoint (api =
# "bedrock_mantle") — SigV4-authenticated with the caller's own AWS
# credentials, no OPENAI_API_KEY needed (see bench.run.call_mantle). Pricing
# verified against https://developers.openai.com/api/docs/pricing on
# 2026-07-15 (Bedrock bills these at OpenAI's first-party rates).
# Note: "gpt-5.6" only exists as three tiers (sol/terra/luna) — terra is used
# here rather than sol, since sol is also the judge model (avoids the
# translation candidate and the judge being the exact same model/tier).
# gpt-5.6-sol/terra/luna and gpt-5.5 reject the `temperature` param outright
# (verified live) — see MANTLE_NO_TEMPERATURE in bench/run.py; gpt-5.4 is the
# one model here that still accepts it.

[[models]]
name = "gpt-5.4"
api = "bedrock_mantle"
model_id = "openai.gpt-5.4"
mantle_region = "us-east-1"
price_in = 2.50
price_out = 15.00
enabled = true

[[models]]
name = "gpt-5.5"
api = "bedrock_mantle"
model_id = "openai.gpt-5.5"
mantle_region = "us-east-1"
price_in = 5.00
price_out = 30.00
enabled = true

[[models]]
name = "gpt-5.6-terra"
api = "bedrock_mantle"
model_id = "openai.gpt-5.6-terra"
mantle_region = "us-east-1"
price_in = 2.50
price_out = 15.00
enabled = true

[[models]]
name = "gpt-5.6-luna"
api = "bedrock_mantle"
model_id = "openai.gpt-5.6-luna"
mantle_region = "us-east-1"
price_in = 1.00
price_out = 6.00
enabled = true

# xAI's Grok 4.3, launched on Bedrock 2026-06-15 (verified live: not in
# `aws bedrock list-foundation-models` — mantle-only models never appear
# there, same as our openai.gpt-5.x entries above — confirmed via AWS's own
# model-card docs page and cross-checked pricing against aws.amazon.com/bedrock/pricing).
# Same bedrock-mantle mechanism/endpoint we already built for OpenAI, no new
# integration code needed beyond reasoning-effort support (see mantle_reasoning_effort).
[[models]]
name = "grok-4.3"
api = "bedrock_mantle"
model_id = "xai.grok-4.3"
mantle_region = "us-west-2"
price_in = 1.25
price_out = 2.50
# The explicit-prompt comparison matches Grok 4.6's region and reasoning.
# July observations retain their recorded us-east-1 / none settings.
mantle_reasoning_effort = "low"
request_max_attempts = 4
enabled = true

# Grok 4.6 added 2026-09-13. Model ID, us-west-2 Mantle availability, and
# Standard In-Region pricing verified against the AWS model card:
# https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-xai-grok-4-6.html
# $2.20/$6.60 per 1M input/output tokens (not Global CRIS's $2/$6).
# Live SigV4 smoke call accepted temperature=0 and reasoning effort "low".
# Unlike grok-4.3, the documented choices start at low: reasoning remains on.
# Keep the shared 4096 output-token cap and record this comparability caveat
# through the existing mantle_reasoning_effort manifest/report field.
[[models]]
name = "grok-4.6"
api = "bedrock_mantle"
model_id = "xai.grok-4.6"
mantle_region = "us-west-2"
price_in = 2.20
price_out = 6.60
mantle_reasoning_effort = "low"
request_max_attempts = 4  # initial request + up to 3 transient retries; timeout remains 120s
enabled = true

