# One-time setup on the shared fsi-demo-cluster (demo-vpc = fsi-demo-vpc): a
# dedicated GPU EC2NodeClass + NodePool for vLLM benchmark serving. Apply once
# (idempotent; deploy/serve.sh does it on every run):
#   kubectl --context arn:aws:eks:ap-northeast-2:180294183052:cluster/fsi-demo-cluster apply -f deploy/karpenter-gpu.yaml
#
# Mirrors the cluster's existing "gpu-paddleocr" EC2NodeClass (same node role,
# subnet/SG discovery tag, AMI alias, taint key) — read from the live cluster,
# not from checked-in configs. Kept as its own EC2NodeClass/NodePool instead of
# reusing another team's "gpu" pools so this repo can be removed with one
# `kubectl delete nodepool,ec2nodeclass gpu-bench`.
#
# The cluster already runs NVIDIA device-plugin DaemonSets that select nodes by
# the label nvidia.com/device-plugin.config: the "default" one (1 GPU = 1
# schedulable nvidia.com/gpu, required for tensor parallelism) tolerates the
# standard nvidia.com/gpu taint. So the NodePool below only needs that label and
# taint — this repo installs no device plugin of its own (a second plugin would
# register the same resource twice).
#
# This cluster's Karpenter is v1.4.0 (mall-apne2-mgmt had v1.9.0): the g6 / g6e
# types below predate it, but anything newer (e.g. g7e) is NOT known to it.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-bench
spec:
  amiSelectorTerms:
    - alias: al2023@v20260810   # same pinned AL2023 release gpu-paddleocr runs on this cluster; the family auto-picks the NVIDIA AMI variant for GPU types
  role: eksctl-fsi-demo-cluster-nodegroup--NodeInstanceRole-bkIx3tpZWPNz
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: fsi-demo-cluster   # the demo-vpc private subnets, 2a + 2b (/24 each: watch free IPs for 8-GPU nodes)
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: fsi-demo-cluster
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi   # HF model cache (emptyDir) — 70B fp16 alone is ~140GB
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true
  tags:
    NodePool: gpu-bench
    Project: llm-benchmark
    managed-by: karpenter
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-bench
spec:
  template:
    metadata:
      labels:
        node-pool: gpu-bench
        node-type: gpu
        workload: llm-bench
        nvidia.com/device-plugin.config: default   # picked up by the cluster's nvidia-device-plugin-default-daemonset
    spec:
      requirements:
        # g6 (NVIDIA L4): 4xlarge (1 GPU/22GB) for <=13B, 12xlarge (4 GPU/89GB)
        # for 27-32B, 48xlarge (8 GPU/179GB) for 70B — the sizes config.toml
        # asks for. g6e.12xlarge is kept for the (disabled) gemma-4-31b entry.
        # Sizing history (g7e unsupported by older Karpenter, g6e network
        # surprises on the previous cluster) is in CLAUDE.md.
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [g6.4xlarge, g6.12xlarge, g6.48xlarge, g6e.12xlarge]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-bench
      taints:
        - key: nvidia.com/gpu        # the cluster-wide GPU taint every gpu pool and the device plugins already use
          value: "true"
          effect: NoSchedule
      expireAfter: 720h
  limits:
    cpu: "208"     # one g6.48xlarge (192) + one g6.4xlarge (16) headroom; hard cap against runaway provisioning
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 60s   # auto-terminates the GPU node ~60s after the vLLM pod is deleted — no manual scale-down step needed
