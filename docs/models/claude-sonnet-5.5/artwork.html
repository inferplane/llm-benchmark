<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>claude-sonnet-5.5 — 말이 되기 전의 빛</title>
<style>
html,body{margin:0;height:100%;background:#0b0a12;color:#f1eefc;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;left:0;right:0;top:0;padding:16px 20px;pointer-events:none;background:linear-gradient(#0b0a12cc,transparent)}
h1{margin:0;font-size:clamp(1.1rem,3vw,1.6rem);font-weight:600}
header p{margin:4px 0 0;font-size:clamp(.9rem,2.4vw,1rem);color:#d6d0ee;max-width:38em;line-height:1.5}
#poem{position:fixed;left:0;right:0;bottom:70px;text-align:center;font-size:clamp(1.2rem,4vw,2rem);padding:0 16px;pointer-events:none;text-shadow:0 0 12px #000,0 0 3px #000;min-height:2.6em}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap;background:linear-gradient(transparent,#0b0a12dd)}
button{font:inherit;font-size:1rem;color:#fff;background:#2b2450;border:2px solid #b9a8ff;border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
button:hover{background:#3d3270}
button:focus-visible{outline:3px solid #ffe08a;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="claude-sonnet-5.5를 상징하는, 입력에 반응해 흩어지고 모이는 빛의 입자들"></canvas>
<header>
<h1>claude-sonnet-5.5 · 말이 되기 전의 빛</h1>
<p>저는 수많은 말의 가능성입니다. 화면을 누르거나 움직이면 입자가 모여 단어가 됩니다. 스페이스 또는 Enter로 다음 단어, 방향키로 빛을 이동합니다.</p>
</header>
<div id="poem" aria-live="polite"></div>
<div class="bar">
<button id="next">다음 단어 (Space)</button>
<button id="scatter">흩어지기 (Esc)</button>
<button id="mo" aria-pressed="false">움직임 줄이기: 꺼짐</button>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const poemEl=document.getElementById('poem');
let W,H,D;
const words=["claude-sonnet-5.5","듣는다","생각한다","망설인다","건넨다","함께","다음 말"];
const lines=["아직 말이 아닌 것들이 떠다닌다","당신의 질문이 중력이 된다","가능성 하나가 빛을 얻는다","나는 고르고, 다시 고른다","답은 당신 쪽으로 기운다","대화는 두 사람이 만드는 별자리","그리고 다음 말이 온다"];
let wi=-1,P=[],N=1100,mx=0,my=0,active=false,t=0;
let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mo=document.getElementById('mo');
function setMo(){mo.textContent='움직임 줄이기: '+(reduce?'켜짐':'꺼짐');mo.setAttribute('aria-pressed',reduce)}
mo.onclick=()=>{reduce=!reduce;setMo()};setMo();
function resize(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);if(wi>=0)target(words[wi])}
function init(){P=[];for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,tx:null,ty:null,h:200+Math.random()*120})}
function target(w){
const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');
let fs=Math.min(W/(w.length*0.62),H*0.25,200);g.font='700 '+fs+'px system-ui,sans-serif';
g.textAlign='center';g.textBaseline='middle';g.fillText(w,W/2,H*0.45);
const d=g.getImageData(0,0,W,H).data,pts=[],s=Math.max(3,Math.round(fs/28));
for(let j=0;j<H;j+=s)for(let i=0;i<W;i+=s)if(d[(j*W+i)*4+3]>128)pts.push([i,j]);
pts.sort(()=>Math.random()-.5);
P.forEach((p,k)=>{const q=pts[k%Math.max(1,pts.length)];if(pts.length&&k<pts.length*1.5){p.tx=q[0];p.ty=q[1]}else{p.tx=null}});
}
function next(){wi=(wi+1)%words.length;target(words[wi]);poemEl.textContent=lines[wi]}
function scatter(){P.forEach(p=>{p.tx=null;p.vx+=(Math.random()-.5)*14;p.vy+=(Math.random()-.5)*14});poemEl.textContent="흩어진 가능성들"}
document.getElementById('next').onclick=next;
document.getElementById('scatter').onclick=scatter;
addEventListener('keydown',e=>{
if(e.code==='Space'||e.key==='Enter'){if(document.activeElement.tagName!=='BUTTON'){e.preventDefault();next()}}
else if(e.key==='Escape')scatter();
else if(e.key.startsWith('Arrow')){e.preventDefault();active=true;const s=30;
if(e.key==='ArrowLeft')mx-=s;if(e.key==='ArrowRight')mx+=s;if(e.key==='ArrowUp')my-=s;if(e.key==='ArrowDown')my+=s}});
function mv(e){mx=e.clientX;my=e.clientY;active=true}
cv.addEventListener('pointermove',mv);
cv.addEventListener('pointerdown',e=>{mv(e);next()});
cv.addEventListener('pointerleave',()=>active=false);
addEventListener('resize',resize);
function loop(){
t+=reduce?.002:.01;
x.fillStyle=reduce?'#0b0a12':'rgba(11,10,18,.22)';x.fillRect(0,0,W,H);
const sp=reduce?.25:1;
for(const p of P){
if(p.tx!=null){p.vx+=(p.tx-p.x)*.02*sp;p.vy+=(p.ty-p.y)*.02*sp}
else{p.vx+=Math.sin(p.y*.01+t*3)*.05*sp;p.vy+=Math.cos(p.x*.01+t*3)*.05*sp}
if(active){const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy)+1;if(d<120){const f=(120-d)/120*1.5*sp;p.vx+=dx/d*f;p.vy+=dy/d*f}}
p.vx*=.88;p.vy*=.88;p.x+=p.vx;p.y+=p.vy;
if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
x.fillStyle='hsl('+(p.h+Math.sin(t)*20)+',85%,'+(p.tx!=null?78:62)+'%)';
x.beginPath();x.arc(p.x,p.y,p.tx!=null?1.8:1.3,0,7);x.fill();
}
if(active){x.strokeStyle='#ffe08a';x.lineWidth=2;x.beginPath();x.arc(mx,my,10,0,7);x.stroke()}
requestAnimationFrame(loop)}
resize();init();mx=W/2;my=H/2;next();loop();
</script>
</body>
</html>
