<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b18">
<title>달의 문장 — gpt-6-luna</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #090b18;
    --paper: #f1f0e8;
    --muted: #b8bad0;
    --moon: #c8f3e7;
    --line: rgba(226, 232, 255, .17);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    color: var(--paper);
    background:
      radial-gradient(ellipse at 50% 43%, rgba(62, 80, 132, .24), transparent 48%),
      radial-gradient(ellipse at 12% 85%, rgba(24, 97, 97, .15), transparent 34%),
      var(--ink);
  }
  main {
    width: min(1120px, 100%);
    min-height: 100vh;
    margin: auto;
    padding: clamp(1.25rem, 5vw, 4rem);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  header, footer { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .eyebrow, .status, .caption, .controls { font-size: .82rem; letter-spacing: .08em; }
  .eyebrow { color: var(--muted); text-transform: uppercase; }
  .model { color: var(--moon); font-weight: 650; letter-spacing: .04em; }
  .stage {
    position: relative;
    min-height: min(66vh, 680px);
    display: grid;
    place-items: center;
    overflow: hidden;
    isolation: isolate;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    touch-action: manipulation;
  }
  .message {
    max-width: 32rem;
    padding: 2rem 1.25rem;
    text-align: center;
    pointer-events: none;
  }
  .message h1 {
    margin: 0 0 .75rem;
    font-size: clamp(2.2rem, 7vw, 5.3rem);
    line-height: 1.04;
    font-weight: 500;
    letter-spacing: -.06em;
  }
  .message p {
    margin: 0 auto;
    max-width: 27rem;
    color: #c9cada;
    font-size: clamp(1rem, 2vw, 1.12rem);
    line-height: 1.8;
  }
  .caption { color: var(--muted); letter-spacing: .03em; }
  footer { padding-top: 1.25rem; border-top: 1px solid var(--line); }
  .controls { display: flex; align-items: center; gap: .65rem; color: var(--muted); }
  button {
    min-height: 44px;
    padding: .65rem 1rem;
    border: 1px solid rgba(200, 243, 231, .45);
    border-radius: 999px;
    background: rgba(200, 243, 231, .08);
    color: var(--paper);
    font: inherit;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
  }
  button:hover { background: rgba(200, 243, 231, .17); border-color: var(--moon); }
  button:focus-visible { outline: 3px solid #f2d18a; outline-offset: 4px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  @media (max-width: 600px) {
    main { padding: 1.2rem 1.1rem; }
    .stage { min-height: 62vh; }
    footer { align-items: flex-start; flex-direction: column; }
    .controls { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <span class="eyebrow">작은 신호들의 천문대</span>
    <span class="model">gpt-6-luna</span>
  </header>

  <section class="stage" aria-label="별빛을 눌러 문장을 만들어 보세요">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="message">
      <h1>나는 달빛으로<br>대답합니다.</h1>
      <p>별 하나를 건드리면, 조용한 신호가 번져요.<br>밤의 아무 곳이나 눌러 보세요.</p>
    </div>
  </section>

  <footer>
    <div class="caption">입력은 파동이 되고, 파동은 잠시 머뭅니다.</div>
    <div class="controls">
      <span>키보드: <kbd>Enter</kbd> 또는 <kbd>Space</kbd></span>
      <button id="pulse" type="button">파동 보내기</button>
      <button id="motion" type="button" aria-pressed="false">움직임 멈추기</button>
    </div>
  </footer>
  <p class="sr-only" id="announce" aria-live="polite">달빛의 별자리입니다. 화면을 누르거나 파동 보내기를 선택하세요.</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const stage = canvas.parentElement;
  const announce = document.getElementById('announce');
  const motionButton = document.getElementById('motion');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let width = 0, height = 0, dpr = 1, points = [], ripples = [];
  let paused = reduced.matches, last = 0, frame = 0;
  const random = (min, max) => min + Math.random() * (max - min);

  function resize() {
    const box = stage.getBoundingClientRect();
    width = box.width; height = box.height;
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    points = Array.from({length: Math.max(45, Math.floor(width * height / 7800))}, () => ({
      x: random(0, width), y: random(0, height),
      r: random(.55, 1.7), phase: random(0, Math.PI * 2), tint: Math.random()
    }));
    draw(0);
  }

  function send(x = width / 2, y = height / 2) {
    ripples.push({ x, y, radius: 0, alpha: .78 });
    announce.textContent = '새로운 달빛 파동이 퍼집니다.';
  }

  function draw(time) {
    if (paused) return;
    const dt = Math.min((time - last) / 1000 || 0, .05);
    last = time;
    ctx.clearRect(0, 0, width, height);

    const cx = width / 2, cy = height / 2;
    const glow = ctx.createRadialGradient(cx, cy, 8, cx, cy, Math.min(width, height) * .46);
    glow.addColorStop(0, 'rgba(105, 191, 173, .10)');
    glow.addColorStop(.48, 'rgba(105, 145, 204, .06)');
    glow.addColorStop(1, 'rgba(9, 11, 24, 0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, width, height);

    points.forEach(p => {
      const twinkle = .38 + .42 * (1 + Math.sin(time * .00065 + p.phase)) / 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.tint > .82
        ? `rgba(200, 243, 231, ${twinkle})`
        : `rgba(204, 211, 245, ${twinkle * .72})`;
      ctx.fill();
    });

    ripples = ripples.filter(r => r.alpha > .025);
    ripples.forEach(r => {
      r.radius += (85 + r.radius * .55) * dt;
      r.alpha *= Math.pow(.18, dt);
      [1, .69, .4].forEach((scale, i) => {
        ctx.beginPath();
        ctx.arc(r.x, r.y, Math.max(0, r.radius * scale), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(190, 245, 226, ${r.alpha * (1 - i * .2)})`;
        ctx.lineWidth = i === 0 ? 1.5 : 1;
        ctx.stroke();
      });
    });
    frame = requestAnimationFrame(draw);
  }

  function setPaused(value) {
    paused = value;
    motionButton.setAttribute('aria-pressed', String(value));
    motionButton.textContent = value ? '움직임 다시 켜기' : '움직임 멈추기';
    if (value) cancelAnimationFrame(frame);
    else { last = 0; frame = requestAnimationFrame(draw); }
  }

  stage.addEventListener('pointerdown', event => {
    const rect = stage.getBoundingClientRect();
    send(event.clientX - rect.left, event.clientY - rect.top);
    if (paused) {
      const { x, y } = ripples[ripples.length - 1];
      ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(190,245,226,.7)'; ctx.stroke();
    }
  });
  document.getElementById('pulse').addEventListener('click', () => send());
  motionButton.addEventListener('click', () => setPaused(!paused));
  window.addEventListener('keydown', event => {
    if ((event.code === 'Space' || event.code === 'Enter') &&
        !['BUTTON', 'INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
      event.preventDefault(); send();
    }
  });
  reduced.addEventListener?.('change', event => setPaused(event.matches));
  new ResizeObserver(resize).observe(stage);
  resize();
  if (!paused) frame = requestAnimationFrame(draw);
})();
</script>
</body>
</html>
