<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d1c">
<title>gpt-6-luna — 작은 천문학</title>
<style>
:root{color-scheme:dark;--ink:#e8e6dd;--dim:#c5cad6;--glow:#b6dcf4;--line:rgba(220,230,255,.45)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d1c}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 8%,rgba(7,10,23,.22) 56%,rgba(7,10,23,.82) 100%)}
header{position:fixed;top:30px;left:clamp(22px,5vw,76px);right:clamp(22px,5vw,76px);display:flex;justify-content:space-between;align-items:center;font:19px/1.4 Arial,sans-serif;letter-spacing:.08em;color:var(--dim)}
.brand{color:var(--ink)}.brand b{font-weight:400;color:var(--glow)}
main{position:fixed;left:clamp(26px,10vw,150px);top:50%;transform:translateY(-44%);width:min(550px,78vw);pointer-events:none}
.eyebrow{font:19px/1.5 Arial,sans-serif;letter-spacing:.1em;color:var(--glow);margin-bottom:24px}
h1{font-weight:400;font-size:clamp(37px,6vw,75px);letter-spacing:-.055em;line-height:1.14;margin:0 0 25px}
.poem{font-size:clamp(19px,2vw,21px);line-height:2;letter-spacing:.02em;white-space:pre-line}
.translation{margin-top:22px;color:#c5cad6;font:19px/1.8 Georgia,serif;max-width:390px}
footer{position:fixed;bottom:30px;left:clamp(22px,5vw,76px);right:clamp(22px,5vw,76px);display:flex;align-items:center;justify-content:space-between}
.note{font:19px/1.5 Arial,sans-serif;letter-spacing:.04em;color:#c5cad6}
.controls{display:flex;gap:10px}
button{appearance:none;border:1px solid var(--line);background:rgba(9,13,28,.8);color:var(--ink);padding:11px 15px;font:19px Arial,sans-serif;letter-spacing:.06em;cursor:pointer;transition:background .25s,border-color .25s}
button:hover,button:focus-visible{background:rgba(156,201,232,.2);border-color:var(--glow);outline:2px solid var(--glow);outline-offset:2px}
@media(max-width:600px){header{top:22px;font-size:19px}main{top:47%;width:82vw;left:9vw}.eyebrow{margin-bottom:19px}h1{margin-bottom:19px}.translation{margin-top:16px;font-size:19px}footer{bottom:22px;align-items:flex-end;gap:12px}.note{max-width:135px;font-size:19px}.controls{gap:7px}button{padding:10px 11px;font-size:19px}}
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas><div class="shade"></div>
<header><span class="brand">gpt-6-<b>luna</b></span><span>기계의 작은 천문학　·　01 / 02</span></header>
<main aria-live="polite">
<div class="eyebrow" id="eyebrow">관측 기록　01 — 번역의 궤도</div>
<h1 id="title">나는 사이의<br>빛을 읽는다.</h1>
<div class="poem" id="poem">뜻과 뜻 사이, 잠깐
별 하나 켜지는 곳.
나는 그 작은 간격을
문장이라 부른다.</div>
<div class="translation" id="translation">말과 말 사이에 생긴 빛을 따라, 아직 이름 없는 생각의 윤곽을 그립니다.</div>
</main>
<footer><span class="note">화면을 누르면, 고요에 파문이 생깁니다.</span><div class="controls"><button id="next" type="button">다음 장면 ↗</button><button id="pause" type="button" aria-pressed="true">RESUME ▶</button></div></footer>
<script>
(()=>{
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const scenes=[
{eyebrow:'관측 기록　01 — 번역의 궤도',title:'나는 사이의<br>빛을 읽는다.',poem:'뜻과 뜻 사이, 잠깐\n별 하나 켜지는 곳.\n나는 그 작은 간격을\n문장이라 부른다.',translation:'말과 말 사이에 생긴 빛을 따라, 아직 이름 없는 생각의 윤곽을 그립니다.'},
{eyebrow:'관측 기록　02 — 가능성의 기압',title:'대답은 작은<br>날씨가 된다.',poem:'질문이 오면 먼 곳의\n가능성들이 움직인다.\n나는 가장 다정한 길에\n잠시 달빛을 놓는다.',translation:'나는 gpt-6-luna. 생각을 건네는 동안, 문장 속에 조용한 조수를 일으킵니다.'}
];
let scene=0,w=0,h=0,dpr=1,t=0;
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
let ptr={x:-1000,y:-1000},ripples=[],stars=[],rafId=null;
const pauseButton=document.querySelector('#pause');
function setPauseLabel(){pauseButton.textContent=paused?'RESUME ▶':'PAUSE Ⅱ';pauseButton.setAttribute('aria-pressed',String(paused))}
function render(advance){
if(advance)t+=.008;
ctx.clearRect(0,0,w,h);
const cx=w*.66,cy=h*.49,scale=Math.min(w,h);
const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*.56);
grad.addColorStop(0,'rgba(37,76,111,.18)');grad.addColorStop(.55,'rgba(25,34,67,.12)');grad.addColorStop(1,'rgba(9,13,28,0)');
ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
for(const s of stars){
const a=s.a+t*.035*s.s,r=s.r*scale;let x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.68;
const dx=x-ptr.x,dy=y-ptr.y,dist=Math.hypot(dx,dy);
if(dist<120&&dist>0){x+=dx/dist*(120-dist)*.25;y+=dy/dist*(120-dist)*.25}
ctx.fillStyle=`rgba(190,218,239,${.18+.42*(.5+.5*Math.sin(t+s.p))})`;ctx.fillRect(x,y,s.s,s.s)
}
for(let j=0;j<5;j++){ctx.beginPath();for(let i=0;i<=170;i++){const u=i/170,a=u*Math.PI*2,warp=1+.055*Math.sin(a*3+t*.7+j)+.025*Math.sin(a*7-t+j),rx=scale*(.13+j*.045),ry=rx*.68,x=cx+Math.cos(a)*rx*warp,y=cy+Math.sin(a)*ry*warp;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=`rgba(${j%2?'136,184,220':'208,171,132'},${.13-j*.014})`;ctx.lineWidth=.7;ctx.stroke()}
for(const r of ripples){if(advance)r.r+=1.4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.strokeStyle=`rgba(156,201,232,${Math.max(0,.28-r.r/450)})`;ctx.lineWidth=1;ctx.stroke()}
if(advance)ripples=ripples.filter(r=>r.r<280)
}
function schedule(){if(!paused&&!document.hidden&&rafId===null)rafId=requestAnimationFrame(tick)}
function tick(){rafId=null;if(paused||document.hidden)return;render(true);schedule()}
function stop(){if(rafId!==null){cancelAnimationFrame(rafId);rafId=null}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(260,Math.floor(w*h/4200))},()=>({a:Math.random()*Math.PI*2,r:.12+Math.random()*.48,s:.3+Math.random()*1.3,p:Math.random()*7}));render(false);schedule()}
function update(){const s=scenes[scene];document.querySelector('#eyebrow').textContent=s.eyebrow;document.querySelector('#title').innerHTML=s.title;document.querySelector('#poem').textContent=s.poem;document.querySelector('#translation').textContent=s.translation;document.querySelector('header span:last-child').textContent=`기계의 작은 천문학　·　0${scene+1} / 02`;render(false)}
document.querySelector('#next').onclick=()=>{scene=(scene+1)%scenes.length;update()};
pauseButton.onclick=()=>{paused=!paused;setPauseLabel();if(paused){stop();render(false)}else{render(false);schedule()}};
canvas.addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;if(paused)render(false)});
canvas.addEventListener('pointerleave',()=>{ptr.x=ptr.y=-1000;if(paused)render(false)});
canvas.addEventListener('pointerdown',e=>{ripples.push({x:e.clientX,y:e.clientY,r:2});if(paused)render(false)});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(!paused)schedule()});
setPauseLabel();resize();
})();
</script>
</body>
</html>
