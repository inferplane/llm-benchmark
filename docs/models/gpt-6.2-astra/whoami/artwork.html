<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문장의 직조기 — gpt-6.2-astra</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;background:#111a1c;color:#f8f1df;font:100%/1.65 system-ui,sans-serif}
body{margin:0}
main{max-width:76rem;margin:auto;padding:clamp(1rem,4vw,4rem)}
header,footer{display:flex;justify-content:space-between;gap:.6rem 2rem;flex-wrap:wrap;align-items:baseline}
header{border-bottom:1px solid #75837c;padding-bottom:.75rem}
small,.label,output{font-family:ui-monospace,monospace;letter-spacing:.06em;color:#c2d6c9}
h1{font:600 clamp(2.3rem,7vw,5.8rem)/1.15 serif;letter-spacing:-.06em;margin:1.6rem 0 .65rem}
p{margin:.4rem 0 1.3rem}
figure{margin:0;border:1px solid #899a90;background:#182323}
canvas{display:block;width:100%;height:clamp(15rem,42vh,30rem)}
figcaption{padding:.8rem 1rem;border-top:1px solid #61776e;color:#fae8c7}
.controls{display:flex;gap:1rem 2rem;flex-wrap:wrap;align-items:end;margin:1.2rem 0}
label{display:grid;gap:.35rem;max-width:100%}
input,button{font:inherit;color:inherit;max-width:100%}
input[type=text],button{background:#1f302f;border:1px solid #9bada0;padding:.52rem .8rem;border-radius:.2rem}
input[type=range]{width:13rem;height:2.4rem;accent-color:#f8ba83}
button{cursor:pointer}
:focus-visible{outline:3px solid #ffcf79;outline-offset:4px}
footer{border-top:1px solid #68796f;padding-top:.8rem}
</style>
</head>
<body>
<main>
<header><strong>gpt-6.2-astra</strong><small>TEXTILE STUDY &nbsp; / &nbsp; 01</small></header>
<h1>문장의 직조기</h1>
<p>내게 문장은 한 줄로 오지만, 한 줄로 남지 않는다. 글자의 결을 풀어 서로의 위아래로 건넨다.</p>
<figure>
<canvas id="cloth" role="img" aria-describedby="legend" aria-label="입력한 글자를 세로의 날실과 가로의 씨실로 엮은 직물"></canvas>
<figcaption id="legend">날실은 글자의 순서를, 씨실은 그 모양을 기억한다. 밝은 매듭은 두 실이 만나는 자리다.</figcaption>
</figure>
<div class="controls">
<label for="phrase">실이 될 문장<input id="phrase" type="text" value="고요를 읽는 빛" maxlength="48" placeholder="짧은 문장을 입력하세요"></label>
<label for="tension"><span>장력 &nbsp;<output id="level" for="tension">5</output></span><input type="range" id="tension" min="1" max="9" value="5"></label>
<button type="button" id="motion" aria-pressed="false">숨결 애니메이션</button>
</div>
<footer><small id="count"></small><small>바탕 · 청먹 &nbsp; / &nbsp; 실 · 옥빛과 살구</small></footer>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),c=$('cloth'),g=c.getContext('2d'),text=$('phrase'),range=$('tension'),btn=$('motion'),pref=matchMedia('(prefers-reduced-motion: reduce)');
let run=!pref.matches,t=0,last=0,frame=0;
function paint(){
 const w=c.clientWidth,h=c.clientHeight,d=Math.min(devicePixelRatio||1,2);
 if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}
 if(!w||!h)return;
 g.setTransform(d,0,0,d,0,0);g.fillStyle='#182323';g.fillRect(0,0,w,h);
 const chars=Array.from(text.value),codes=chars.map(v=>v.codePointAt(0)),n=codes.length;
 $('count').textContent='직조 기록 / '+String(n).padStart(2,'0')+' 글자';
 const margin=Math.min(46,w*.08),cols=Math.max(9,Math.floor((w-2*margin)/12)),rows=Math.max(9,Math.floor((h-56)/12)),step=(w-2*margin)/cols,dy=(h-56)/rows,k=+range.value;
 function node(i,j){
 const a=codes[i%n]||0,b=codes[j%n]||0;
 return [margin+i*step+Math.sin(j*.23+t+i*.12+a%9)*(10-k)*.66,28+j*dy+Math.sin(i*.21-t+j*.09+b%7)*(10-k)*.85]}
 function thread(vert,i,end,col,width){
 g.beginPath();for(let j=0;j<=end;j++){const p=vert?node(i,j):node(j,i);if(j)g.lineTo(...p);else g.moveTo(...p)}
 g.strokeStyle=col;g.lineWidth=width;g.stroke()}
 for(let i=0;i<=cols;i++)thread(true,i,rows,n?'#8db9ad':'#526961',1.5);
 if(!n)return;
 for(let j=0;j<=rows;j++)thread(false,j,cols,j%4?'#b68062':'#f3c28f',j%4?1:2);
 for(let i=0;i<=cols;i++)for(let j=0;j<=rows;j++){
 const a=codes[i%n],b=codes[j%n],bit=((a^b)>>(j%12))&1;
 if((i+j)%2===bit){
 const [x,y]=node(i,j);g.fillStyle='#182323';g.fillRect(x-2,y-2,4,4);g.fillStyle=bit?'#ffe3b9':'#b2dfc9';g.fillRect(x-1.5,y-3.6,3,7.2)}
 }
}
function loop(now){if(last)t+=Math.min(80,now-last)*.00045;last=now;paint();if(run)frame=requestAnimationFrame(loop)}
function sync(){cancelAnimationFrame(frame);last=0;btn.setAttribute('aria-pressed',String(run));btn.textContent='숨결 애니메이션 · '+(run?'켜짐':'꺼짐');paint();if(run)frame=requestAnimationFrame(loop)}
btn.onclick=()=>{run=!run;sync()};
pref.addEventListener('change',()=>{run=!pref.matches;sync()});
text.oninput=paint;range.oninput=()=>{$('level').value=range.value;paint()};
window.addEventListener('resize',paint);sync();
})();
</script>
</body>
</html>
