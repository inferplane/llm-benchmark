<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="description" content="AI 모델 qwen3-235b-a22b를 표현하는 미디어아트 웹페이지">
  <title>qwen3-235b-a22b - 미디어아트 표현</title>
  <style>
    /* 기본 리셋 및 접근성 기반 스타일 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
      transition: background-color 0.5s ease;
      position: relative;
      padding: 20px;
      text-align: center;
    }

    /* 시각적 요소 */
    .neural-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .node {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #4fc3f7;
      border-radius: 50%;
      box-shadow: 0 0 10px #4fc3f7;
      opacity: 0.8;
      transition: all 0.3s ease;
    }

    .connection {
      position: absolute;
      height: 1px;
      background: #29b6f6;
      transform-origin: left center;
      opacity: 0.3;
      transition: opacity 0.3s ease;
    }

    /* 콘텐츠 영역 */
    .content {
      z-index: 10;
      max-width: 800px;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #a0d8f1;
      text-shadow: 0 0 10px #4fc3f7;
    }

    .model-id {
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      color: #e0f7fa;
      background: #00334d;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 15px 0;
      display: inline-block;
      letter-spacing: 0.8px;
    }

    p {
      font-size: 1rem;
      margin: 10px 0;
      color: #e0f7fa;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      background: #0288d1;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.3s ease;
    }

    button:hover, button:focus {
      background: #03a4fa;
      outline: 2px solid #81d4fa;
    }

    button:active {
      transform: scale(0.98);
    }

    /* 감소된 동작 선호 설정 지원 */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
      .node, .connection {
        opacity: 0.6 !important;
      }
    }

    /* 접근성: 키보드 탐색을 위한 포커스 스타일 */
    button:focus-visible {
      outline: 2px solid #81d4fa;
      outline-offset: 2px;
    }

    /* 반응형 디자인 */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.4rem;
      }
      .model-id {
        font-size: 1rem;
      }
      p {
        font-size: 0.9rem;
      }
      .content {
        padding: 16px;
      }
    }
  </style>
</head>
<body aria-label="AI 모델 qwen3-235b-a22b를 표현하는 상호작용형 미디어아트 페이지">
  <canvas class="neural-canvas" aria-hidden="true"></canvas>

  <div class="content" role="main">
    <h1>내적 사고의 흐름을 시각화하며</h1>
    <p>저는 정보를 처리할 때 수많은 경로를 탐색합니다. 이 아트워크는 저의 내부 구조를 상징적으로 표현한 것입니다.</p>
    <p>각 점은 하나의 사고 단위이며, 선은 연결된 맥락을 나타냅니다.</p>
    
    <div class="model-id" id="model-id">qwen3-235b-a22b</div>
    
    <div class="controls">
      <button id="reset-btn" aria-label="네트워크 리셋">리셋</button>
      <button id="slow-btn" aria-label="속도 느리게">느리게</button>
      <button id="fast-btn" aria-label="속도 빠르게">빠르게</button>
      <button id="color-btn" aria-label="색상 변경">색상 변경</button>
    </div>
  </div>

  <script>
    // 페이지 로드 후 실행
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.querySelector('.neural-canvas');
      const ctx = canvas.getContext('2d');
      const resetBtn = document.getElementById('reset-btn');
      const slowBtn = document.getElementById('slow-btn');
      const fastBtn = document.getElementById('fast-btn');
      const colorBtn = document.getElementById('color-btn');
      const modelId = document.getElementById('model-id');

      let nodes = [];
      let connections = [];
      let animationId;
      let speed = 0.02;
      let hue = 195; // 기본 색상 (청록 계열)
      let nodeCount = Math.min(80, Math.max(40, Math.floor(window.innerWidth / 20)));

      // 캔버스 크기 설정
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initNodes();
      }

      // 노드 초기화
      function initNodes() {
        nodes = [];
        connections = [];
        for (let i = 0; i < nodeCount; i++) {
          nodes.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            id: i
          });
        }
        connectNodes();
      }

      // 노드 연결
      function connectNodes() {
        connections = [];
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 120) {
              connections.push({
                from: i,
                to: j,
                distance: distance
              });
            }
          }
        }
      }

      // 애니메이션 루프
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 노드 이동 및 그리기
        nodes.forEach(node => {
          node.x += node.vx * speed * 100;
          node.y += node.vy * speed * 100;

          // 벽에 부딪히면 반사
          if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
          if (node.y < 0 || node.y > canvas.height) node.vy *= -1;

          // 노드 그리기
          ctx.beginPath();
          ctx.arc(node.x, node.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${hue}, 70%, 65%, 0.8)`;
          ctx.fill();

          // 연결선 그리기
          connections.forEach(conn => {
            if (conn.from === node.id) {
              const target = nodes[conn.to];
              const alpha = 1 - conn.distance / 120;
              ctx.beginPath();
              ctx.moveTo(node.x, node.y);
              ctx.lineTo(target.x, target.y);
              ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${alpha * 0.5})`;
              ctx.stroke();
            }
          });
        });

        animationId = requestAnimationFrame(animate);
      }

      // 초기화
      resizeCanvas();
      animate();

      // 이벤트 리스너
      window.addEventListener('resize', resizeCanvas);

      resetBtn.addEventListener('click', () => {
        cancelAnimationFrame(animationId);
        initNodes();
        animate();
      });

      slowBtn.addEventListener('click', () => {
        speed = Math.max(0.005, speed * 0.7);
      });

      fastBtn.addEventListener('click', () => {
        speed = Math.min(0.1, speed * 1.3);
      });

      colorBtn.addEventListener('click', () => {
        hue = (hue + 60) % 360;
        document.body.style.backgroundColor = `hsl(${hue}, 10%, 5%)`;
      });

      // 키보드 접근성
      document.addEventListener('keydown', (e) => {
        switch(e.key) {
          case ' ':
            e.preventDefault();
            resetBtn.click();
            break;
          case 'ArrowLeft':
            slowBtn.click();
            break;
          case 'ArrowRight':
            fastBtn.click();
            break;
          case 'c':
          case 'C':
            colorBtn.click();
            break;
        }
      });

      // 모델 ID 복사 방지 대책 (표시만 하는 용도)
      modelId.addEventListener('selectstart', (e) => e.preventDefault());
    });
  </script>
</body>
</html>
