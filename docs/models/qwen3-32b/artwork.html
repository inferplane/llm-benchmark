<!DOCTYPE html>
<html lang="ko" class="no-motion">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qwen3-32b - 미디어아트 웹페이지</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
      --font-size: 1.2rem;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      line-height: 1.6;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      text-align: center;
      color: var(--accent-color);
    }

    p {
      max-width: 600px;
      text-align: center;
      margin-bottom: 2rem;
    }

    .canvas {
      width: 100%;
      max-width: 600px;
      height: 400px;
      background-color: #161b22;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
    }

    .canvas::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #58a6ff, #0d1117);
      opacity: 0.1;
      animation: move 10s linear infinite;
      pointer-events: none;
    }

    @keyframes move {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50%, -50%); }
    }

    .toggle-motion {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      z-index: 1000;
    }

    .toggle-motion:focus {
      outline: 2px solid #fff;
    }

    @media (prefers-reduced-motion: reduce) {
      .canvas::before {
        animation: none;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <h1>Qwen3-32b</h1>
  <p>
    이 페이지는 Qwen3-32b 모델을 표현하는 미디어아트 웹페이지입니다.<br>
    시각적 요소와 텍스트를 통해 인공지능의 창의성과 기술적 깊이를 표현합니다.
  </p>
  <div class="canvas"></div>

  <button class="toggle-motion" onclick="toggleMotion()">움직임 토글</button>

  <script>
    function toggleMotion() {
      document.body.classList.toggle('no-motion');
    }

    // 애니메이션 제어
    if (document.body.classList.contains('no-motion')) {
      document.querySelector('.canvas::before').style.animation = 'none';
    }
  </script>
</body>
</html>
